packages:
  - apps/*
  - packages/*
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
  typescript: 7.0.2
  "@types/node": 26.6.2
  pixi.js: 8.21.0
  "@playwright/test": 1.63.0
# Supply chain: a version must be 3 days old before it can be installed
# (most malicious releases are yanked within hours).
minimumReleaseAge: 4320
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# Vite+ owns the pnpm and Node versions (devEngines): pnpm neither switches itself nor
# manages the runtime.
pmOnFail: ignore
runtimeOnFail: ignore
# Exact versions of the Vite+ 1.5.0 toolchain, younger than minimumReleaseAge when they
# were installed. Each line goes once its version is three days old.
minimumReleaseAgeExclude:
  - "@oxc-project/runtime@0.157.0"
  - "@oxc-project/types@0.157.0"
  - "@oxfmt/binding-android-arm-eabi@0.76.0"
  - "@oxfmt/binding-android-arm64@0.76.0"
